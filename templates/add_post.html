{% extends 'base.html' %}
{% block content %}

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
    }

    /* Banner Image */
    .banner {
        width: 100%;
        height: 250px;
        background: url("https://images.unsplash.com/photo-1499750310107-5fef28a66643") no-repeat center;
        background-size: cover;
        border-radius: 10px;
        margin-bottom: 30px;
    }

    .form-container {
        width: 50%;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0px 6px 15px rgba(0,0,0,0.1);
        text-align: center;
    }

    h2 {
        margin-bottom: 25px;
        color: #333;
    }

    .heading-icon {
        width: 45px;
        display: block;
        margin: 0 auto 10px auto;
    }

    label {
        font-weight: bold;
        display: block;
        text-align: left;
        margin-bottom: 5px;
    }

    input[type="text"],
    select,
    textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 18px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    textarea {
        resize: none;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #45a049;
        transform: scale(1.03);
    }
</style>

<!-- Online Banner -->
<div class="banner"></div>

<div class="form-container">

    <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png" class="heading-icon">

    <h2>Add Blog Post</h2>

    <form method="POST">
        
        <label>Title</label>
        <input type="text" name="title" required>

        <label>Author</label>
        <input type="text" name="author" required>

        <label>Category</label>
        <select name="category">
            {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>

        <label>Content</label>
        <textarea name="content" rows="6" required></textarea>

        <button type="submit">Add Blog</button>
    </form>

</div>

{% endblock %}
