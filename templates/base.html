<!DOCTYPE html>
<html>
<head>
    <title>Simple Blog</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 85%;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px 40px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .navbar {
            text-align: center;
            margin-bottom: 20px;
        }

        .navbar a {
            text-decoration: none;
            color: white;
            background-color: #5a67d8;
            padding: 10px 18px;
            border-radius: 25px;
            margin: 0 8px;
            font-weight: 500;
            transition: 0.3s ease;
        }

        .navbar a:hover {
            background-color: #434190;
            transform: scale(1.05);
        }

        hr {
            border: none;
            height: 1px;
            background: #ddd;
            margin: 20px 0;
        }

        /* Content Styling */
        .content {
            padding: 10px;
            font-size: 16px;
            color: #444;
        }

        /* Button Style */
        .btn {
            display: inline-block;
            padding: 8px 15px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #5a67d8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Blog Website</h1>

        <div class="navbar">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('add_post') }}">Add Post (Admin)</a>
        </div>

        <hr>

        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
