{% extends 'base.html' %}
{% block content %}

<h2>Edit Blog</h2>

<form method="POST">
    Title: <input type="text" name="title" value="{{ blog.title }}"><br><br>
    Author: <input type="text" name="author" value="{{ blog.author }}"><br><br>
    Category:
    <select name="category">
        {% for cat in categories %}
            <option value="{{ cat.id }}" {% if cat.id == blog.category_id %}selected{% endif %}>
                {{ cat.name }}
            </option>
        {% endfor %}
    </select><br><br>
    Content:<br>
    <textarea name="content" rows="5" cols="40">{{ blog.content }}</textarea><br><br>
    <button type="submit">Update</button>
</form>

{% endblock %}
